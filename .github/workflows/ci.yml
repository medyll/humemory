name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Actions pinned by commit SHA rather than mutable tag (SECURITY_AUDIT.md M-03).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      # humemory runs under bun, not node: the store uses `bun:sqlite`, which
      # node's ESM loader cannot resolve. No node-version matrix here — unlike
      # a plain-node package, testing "does this work under several node
      # versions" is meaningless when node never runs the suite.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      # SECURITY_AUDIT.md H-04: the audit was clean at 0 advisories when this
      # gate went in. Fails the build if a high/critical advisory reappears —
      # moderate and below are reported but do not block.
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high

      # Tests are hermetic by project rule (docs/TESTING.md): in-memory SQLite,
      # injectable clock, stubbed LLMClient, no network. Nothing here needs
      # credentials, so there is no separate "smoke" job to skip.
