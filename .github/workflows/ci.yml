name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      NODE_ENV: test
      ANTHROPIC_API_KEY: ''
      HUMEMORY_DB: ':memory:'

    # Actions pinned by commit SHA rather than mutable tag (SECURITY_AUDIT.md M-03).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      # humemory runs under bun, not node: the store uses `bun:sqlite`, which
      # node's ESM loader cannot resolve. No node-version matrix here — unlike
      # a plain-node package, testing "does this work under several node
      # versions" is meaningless when node never runs the suite.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Typechecks and production build
        run: pnpm build

      # Audit A04/A05 acceptance: packs the archive, installs it outside the
      # checkout under a path with a space and an accent, and drives the CLI,
      # hooks, maintenance, MCP and API from there on a virgin profile. A
      # `files` list that forgets a source an auxiliary entry imports is green
      # in every unit test and red here — which is the whole point of running
      # it on all three platforms rather than only where it was written.
      - name: Packaged install (outside the checkout)
        env:
          HUMEMORY_SKIP_BUILD: '1'
        run: pnpm verify:package

      # SECURITY_AUDIT.md H-04: the audit was clean at 0 advisories when this
      # gate went in. Fails the build if a high/critical advisory reappears —
      # moderate and below are reported but do not block.
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high

      # Tests are hermetic by project rule (docs/TESTING.md): in-memory SQLite,
      # injectable clock, stubbed LLMClient, no network. Nothing here needs
      # credentials, so there is no separate "smoke" job to skip.
